<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<script>
  var path = window.location.pathname;
  var base = "/browser-newtab-custom";
  if(path.startsWith(base + "/")){
    var query = path.slice(base.length + 1);
    window.location.replace(base + "/?q=" + encodeURIComponent(query));
  } else {
    window.location.replace(base + "/");
  }
</script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
